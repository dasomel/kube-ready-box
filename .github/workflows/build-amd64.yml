name: Build AMD64 Vagrant Boxes

on:
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: 'Ubuntu version to build'
        required: false
        type: choice
        options:
          - '24.04'
          - '26.04'
        default: '24.04'
      filesystem:
        description: 'Filesystem type'
        required: true
        type: choice
        options:
          - ext4
          - xfs
          - both
        default: both

permissions:
  contents: read

env:
  PACKER_VERSION: '1.15.4'
  UBUNTU_VERSION: ${{ github.event.inputs.ubuntu_version || '24.04' }}

jobs:
  build-virtualbox:
    name: Build VirtualBox AMD64 (${{ matrix.filesystem }})
    # Pinned to 22.04: ubuntu-latest (24.04) ships kernel 6.17-azure for which
    # VirtualBox 7.0 cannot build vboxdrv via DKMS (CVE-2025/2026 v0.2.3 hit this).
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        filesystem:
          - ext4
          - xfs
        exclude:
          - filesystem: ${{ github.event_name == 'workflow_dispatch' && inputs.filesystem == 'xfs' && 'ext4' || 'none' }}
          - filesystem: ${{ github.event_name == 'workflow_dispatch' && inputs.filesystem == 'ext4' && 'xfs' || 'none' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Disable KVM (conflicts with VirtualBox AMD-V)
        run: |
          # KVM occupies AMD-V/VT-x, preventing VirtualBox from using it
          sudo modprobe -r kvm_amd kvm_intel kvm 2>/dev/null || true
          # Verify KVM is unloaded
          if lsmod | grep -q kvm; then
            echo "WARNING: KVM modules still loaded"
            lsmod | grep kvm
          else
            echo "KVM modules successfully unloaded"
          fi

      - name: Install VirtualBox
        run: |
          # Add Oracle VirtualBox repository
          wget -q https://www.virtualbox.org/download/oracle_vbox_2016.asc -O- | sudo apt-key add -
          echo "deb [arch=amd64] https://download.virtualbox.org/virtualbox/debian $(lsb_release -cs) contrib" | sudo tee /etc/apt/sources.list.d/virtualbox.list

          sudo apt-get update
          # DKMS toolchain + matching headers required for vboxdrv build
          sudo apt-get install -y \
            dkms \
            "linux-headers-$(uname -r)" \
            build-essential
          sudo apt-get install -y virtualbox-7.0

          # Reconfigure VirtualBox kernel modules (after KVM removal); fail fast if it cannot build
          sudo /sbin/vboxconfig

          # Verify vboxdrv is actually loaded — the previous CI failure swallowed this with || true
          if ! lsmod | grep -q '^vboxdrv'; then
            echo "ERROR: vboxdrv module did not load after vboxconfig"
            sudo dmesg | tail -50
            exit 1
          fi

          # Verify installation
          VBoxManage --version

      - name: Packer Init
        working-directory: packer
        run: bash ../tools/packer-init.sh
        # 비인증 GitHub API 는 러너 IP 단위로 한도가 걸려 plugin 조회가 403 으로 실패한다.
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Packer Validate
        working-directory: packer
        run: |
          packer validate -only='virtualbox-iso.ubuntu-vbox-amd64' \
            -var 'filesystem=${{ matrix.filesystem }}' \
            -var 'ubuntu_version=${{ env.UBUNTU_VERSION }}' .

      - name: Packer Build
        working-directory: packer
        run: |
          # SSH timeouts used to delete the only installer evidence. Keep console
          # snapshots without changing the guest or Packer's failure status.
          mkdir -p "$RUNNER_TEMP/build-console"
          (
            while true; do
              VBoxManage controlvm "ubuntu-${{ env.UBUNTU_VERSION }}-virtualbox-amd64" \
                screenshotpng "$RUNNER_TEMP/build-console/console-$(date +%s).png" 2>/dev/null || true
              sleep 60
            done
          ) &
          capture_pid=$!
          trap 'kill "$capture_pid" 2>/dev/null || true' EXIT
          packer build -only='virtualbox-iso.ubuntu-vbox-amd64' \
            -var 'headless=true' \
            -var 'filesystem=${{ matrix.filesystem }}' \
            -var 'ubuntu_version=${{ env.UBUNTU_VERSION }}' \
            .

      - name: Verify Box File
        run: |
          BOX="packer/output-vagrant/ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }}-virtualbox-amd64.box"
          if [ ! -f "$BOX" ]; then
            echo "::error::Box file not found: $BOX (build truly failed)"; exit 1
          fi
          ls -lh "$BOX"
          # Integrity: must be a valid gzip tar (catches truncation/partial export)
          tar -tzf "$BOX" >/dev/null || { echo "::error::Box archive is corrupt: $BOX"; exit 1; }
          echo "Box verified OK: $BOX"

      # D9: amd64 박스는 로컬(arm64) 호스트에서 부팅할 수 없다. 같은 러너의 VirtualBox 로
      # 실제 부팅해 검증한 박스만 아티팩트로 올린다(검증 못 한 박스는 배포 후보가 아니다).
      - name: Install Vagrant
        run: |
          wget -qO- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq vagrant
          vagrant --version

      - name: Boot test
        run: |
          BOX="$GITHUB_WORKSPACE/packer/output-vagrant/ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }}-virtualbox-amd64.box"
          mkdir -p "$RUNNER_TEMP/boot" && cd "$RUNNER_TEMP/boot"
          cat > Vagrantfile <<'EOF'
          Vagrant.configure("2") do |config|
            config.vm.box = "kube-ready-test/amd64"
            config.vm.boot_timeout = 900
            config.vm.synced_folder ".", "/vagrant", disabled: true
            config.vm.provider "virtualbox" do |v|
              v.memory = 4096
              v.cpus = 2
            end
          end
          EOF
          vagrant box add --name kube-ready-test/amd64 --provider virtualbox "$BOX"
          vagrant up --provider virtualbox
          cat > guest-check.sh <<'EOF'
          set -u
          rc=0
          for i in $(seq 1 90); do
            [ -e /etc/vagrant-box/growroot.json ] && [ "$(systemctl is-system-running)" != starting ] && break
            sleep 2
          done
          echo "kernel=$(uname -r) state=$(systemctl is-system-running)"
          echo "cmdline=$(cat /proc/cmdline)"
          failed=$(systemctl --failed --no-legend | wc -l); echo "failed_units=$failed"
          [ "$failed" -eq 0 ] || { systemctl --failed --no-legend; rc=1; }
          if sudo grep -Eq 'ds=nocloud|[[:space:]]autoinstall([[:space:]]|$)' /proc/cmdline /etc/default/grub /boot/grub/grub.cfg; then
            echo "installer kernel args present"; rc=1
          fi
          mods=$(ls /lib/modules); echo "modules=$(echo $mods)"
          [ "$mods" = "$(uname -r)" ] || { echo "extra /lib/modules entries"; rc=1; }
          rcpk=$(dpkg-query -W -f='${db:Status-Abbrev} ${Package}\n' 'linux-*' | awk '$1=="rc"{print $2}')
          [ -z "$rcpk" ] || { echo "rc kernel packages: $rcpk"; rc=1; }
          cat /etc/vagrant-box/growroot.json; echo
          grep -q '"status":"PASS"' /etc/vagrant-box/growroot.json || { echo "growroot not PASS"; rc=1; }
          [ -z "$(swapon --show)" ] || { echo "swap active"; rc=1; }
          test -f /etc/cloud/cloud-init.disabled || { echo "cloud-init not disabled"; rc=1; }
          findmnt -no FSTYPE,OPTIONS /
          exit $rc
          EOF
          vagrant upload guest-check.sh /tmp/guest-check.sh
          vagrant ssh -c 'bash /tmp/guest-check.sh'
          vagrant reload
          # shellcheck disable=SC2016 # 게스트에서 확장할 식이다
          vagrant ssh -c 'echo "after_reload state=$(systemctl is-system-running)"; test "$(systemctl --failed --no-legend | wc -l)" -eq 0'
          bash "$GITHUB_WORKSPACE/test-vm/verify_box.sh" virtualbox | tee verify.log
          grep -Eq '^failures=0( |$)' verify.log || { echo "::error::verify_box reported failures"; exit 1; }
          vagrant destroy -f
          vagrant box remove -f kube-ready-test/amd64

      - name: Upload Box Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }}-virtualbox-amd64
          path: packer/output-vagrant/ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }}-virtualbox-amd64.box
          retention-days: 7
          compression-level: 0

      - name: Upload build console diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: console-ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }}-amd64
          path: ${{ runner.temp }}/build-console/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          rm -rf packer/output-*
          VBoxManage list vms | grep -oP '(?<=\")[^\"]+(?=\")' | xargs -I {} VBoxManage unregistervm "{}" --delete 2>/dev/null || true
