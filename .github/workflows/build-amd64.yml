name: Build AMD64 Vagrant Boxes

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Box version (e.g., 0.2.1)'
        required: false
        type: string
        default: ''
      ubuntu_version:
        description: 'Ubuntu version to build'
        required: false
        type: choice
        options:
          - '24.04'
          - '26.04'
        default: '24.04'
      filesystem:
        description: 'Filesystem type'
        required: true
        type: choice
        options:
          - ext4
          - xfs
          - both
        default: both
      publish:
        description: 'Publish to Vagrant Cloud'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  PACKER_VERSION: '1.15.4'
  UBUNTU_VERSION: ${{ github.event.inputs.ubuntu_version || '24.04' }}

jobs:
  build-virtualbox:
    name: Build VirtualBox AMD64 (${{ matrix.filesystem }})
    # Pinned to 22.04: ubuntu-latest (24.04) ships kernel 6.17-azure for which
    # VirtualBox 7.0 cannot build vboxdrv via DKMS (CVE-2025/2026 v0.2.3 hit this).
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        filesystem:
          - ext4
          - xfs
        exclude:
          - filesystem: ${{ github.event_name == 'workflow_dispatch' && inputs.filesystem == 'xfs' && 'ext4' || 'none' }}
          - filesystem: ${{ github.event_name == 'workflow_dispatch' && inputs.filesystem == 'ext4' && 'xfs' || 'none' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Disable KVM (conflicts with VirtualBox AMD-V)
        run: |
          # KVM occupies AMD-V/VT-x, preventing VirtualBox from using it
          sudo modprobe -r kvm_amd kvm_intel kvm 2>/dev/null || true
          # Verify KVM is unloaded
          if lsmod | grep -q kvm; then
            echo "WARNING: KVM modules still loaded"
            lsmod | grep kvm
          else
            echo "KVM modules successfully unloaded"
          fi

      - name: Install VirtualBox
        run: |
          # Add Oracle VirtualBox repository
          wget -q https://www.virtualbox.org/download/oracle_vbox_2016.asc -O- | sudo apt-key add -
          echo "deb [arch=amd64] https://download.virtualbox.org/virtualbox/debian $(lsb_release -cs) contrib" | sudo tee /etc/apt/sources.list.d/virtualbox.list

          sudo apt-get update
          # DKMS toolchain + matching headers required for vboxdrv build
          sudo apt-get install -y \
            dkms \
            "linux-headers-$(uname -r)" \
            build-essential
          sudo apt-get install -y virtualbox-7.0

          # Reconfigure VirtualBox kernel modules (after KVM removal); fail fast if it cannot build
          sudo /sbin/vboxconfig

          # Verify vboxdrv is actually loaded — the previous CI failure swallowed this with || true
          if ! lsmod | grep -q '^vboxdrv'; then
            echo "ERROR: vboxdrv module did not load after vboxconfig"
            sudo dmesg | tail -50
            exit 1
          fi

          # Verify installation
          VBoxManage --version

      - name: Packer Init
        working-directory: packer
        run: packer init .

      - name: Packer Validate
        working-directory: packer
        run: |
          packer validate -only='virtualbox-iso.ubuntu-vbox-amd64' \
            -var 'filesystem=${{ matrix.filesystem }}' \
            -var 'ubuntu_version=${{ env.UBUNTU_VERSION }}' .

      - name: Packer Build
        working-directory: packer
        run: |
          packer build -only='virtualbox-iso.ubuntu-vbox-amd64' \
            -var 'headless=true' \
            -var 'filesystem=${{ matrix.filesystem }}' \
            -var 'ubuntu_version=${{ env.UBUNTU_VERSION }}' \
            .

      - name: Verify Box File
        run: |
          BOX="packer/output-vagrant/ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }}-virtualbox-amd64.box"
          if [ ! -f "$BOX" ]; then
            echo "::error::Box file not found: $BOX (build truly failed)"; exit 1
          fi
          ls -lh "$BOX"
          # Integrity: must be a valid gzip tar (catches truncation/partial export)
          tar -tzf "$BOX" >/dev/null || { echo "::error::Box archive is corrupt: $BOX"; exit 1; }
          echo "Box verified OK: $BOX"

      - name: Upload Box Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }}-virtualbox-amd64
          path: packer/output-vagrant/ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }}-virtualbox-amd64.box
          retention-days: 7
          compression-level: 0

      - name: Cleanup
        if: always()
        run: |
          rm -rf packer/output-*
          VBoxManage list vms | grep -oP '(?<=\")[^\"]+(?=\")' | xargs -I {} VBoxManage unregistervm "{}" --delete 2>/dev/null || true

  publish:
    name: Publish ${{ matrix.filesystem }} to Vagrant Cloud
    needs: build-virtualbox
    runs-on: ubuntu-latest
    if: inputs.publish == true
    strategy:
      fail-fast: false
      matrix:
        filesystem:
          - ext4
          - xfs
        exclude:
          - filesystem: ${{ github.event_name == 'workflow_dispatch' && inputs.filesystem == 'xfs' && 'ext4' || 'none' }}
          - filesystem: ${{ github.event_name == 'workflow_dispatch' && inputs.filesystem == 'ext4' && 'xfs' || 'none' }}

    environment: production

    steps:
      - name: Download Box Artifact
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }}-virtualbox-amd64
          path: ./boxes

      - name: Get Version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=$(date +%Y.%m.%d)" >> $GITHUB_OUTPUT
          fi

      - name: Setup Vagrant
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y vagrant

      - name: Get FS Upper
        id: fs
        run: echo "upper=$(echo '${{ matrix.filesystem }}' | tr '[:lower:]' '[:upper:]')" >> $GITHUB_OUTPUT

      - name: Publish to Vagrant Cloud
        env:
          HCP_CLIENT_ID: ${{ secrets.HCP_CLIENT_ID }}
          HCP_CLIENT_SECRET: ${{ secrets.HCP_CLIENT_SECRET }}
        run: |
          vagrant cloud publish dasomel/ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }} \
            ${{ steps.version.outputs.version }} \
            virtualbox \
            boxes/ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }}-virtualbox-amd64.box \
            --architecture amd64 \
            --force \
            --version-description "Kubernetes-ready Ubuntu ${{ env.UBUNTU_VERSION }} LTS (${{ steps.fs.outputs.upper }} filesystem) v${{ steps.version.outputs.version }}

          ## Filesystem: ${{ steps.fs.outputs.upper }}
          - ext4: Mature, stable, supports online shrink
          - xfs: Better for large files, parallel I/O, K8s ephemeral storage quota

          ## Features
          - Ubuntu ${{ env.UBUNTU_VERSION }} LTS with OS optimizations for Kubernetes
          - Multi-architecture support (AMD64, ARM64)
          - Multi-provider support (VirtualBox, VMware)
          - 1TB disk with auto-extension at boot (thin provisioning)
          - Filesystem selection: ext4 or xfs

          ## Documentation
          https://github.com/dasomel/kube-ready-box" \
            --release \
            --short-description "K8s-ready Ubuntu ${{ env.UBUNTU_VERSION }} (${{ steps.fs.outputs.upper }}) Vagrant Box"
