name: Build AMD64 Vagrant Boxes

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Box version (e.g., 0.2.1)'
        required: false
        type: string
        default: ''
      filesystem:
        description: 'Filesystem type'
        required: true
        type: choice
        options:
          - ext4
          - xfs
          - both
        default: both
      publish:
        description: 'Publish to Vagrant Cloud'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  PACKER_VERSION: '1.10.0'

jobs:
  build-virtualbox:
    name: Build VirtualBox AMD64 (${{ matrix.filesystem }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        filesystem:
          - ext4
          - xfs
        exclude:
          - filesystem: ${{ github.event_name == 'workflow_dispatch' && inputs.filesystem == 'xfs' && 'ext4' || 'none' }}
          - filesystem: ${{ github.event_name == 'workflow_dispatch' && inputs.filesystem == 'ext4' && 'xfs' || 'none' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Disable KVM (conflicts with VirtualBox AMD-V)
        run: |
          # KVM occupies AMD-V/VT-x, preventing VirtualBox from using it
          sudo modprobe -r kvm_amd kvm_intel kvm 2>/dev/null || true
          # Verify KVM is unloaded
          if lsmod | grep -q kvm; then
            echo "WARNING: KVM modules still loaded"
            lsmod | grep kvm
          else
            echo "KVM modules successfully unloaded"
          fi

      - name: Install VirtualBox
        run: |
          # Add Oracle VirtualBox repository
          wget -q https://www.virtualbox.org/download/oracle_vbox_2016.asc -O- | sudo apt-key add -
          echo "deb [arch=amd64] https://download.virtualbox.org/virtualbox/debian $(lsb_release -cs) contrib" | sudo tee /etc/apt/sources.list.d/virtualbox.list

          sudo apt-get update
          sudo apt-get install -y virtualbox-7.0

          # Reconfigure VirtualBox kernel modules (after KVM removal)
          sudo /sbin/vboxconfig || true

          # Verify installation
          VBoxManage --version

      - name: Packer Init
        working-directory: packer
        run: packer init .

      - name: Packer Validate
        working-directory: packer
        run: |
          packer validate -only='virtualbox-iso.ubuntu-vbox-amd64' \
            -var 'filesystem=${{ matrix.filesystem }}' .

      - name: Packer Build
        working-directory: packer
        run: |
          packer build -only='virtualbox-iso.ubuntu-vbox-amd64' \
            -var 'headless=true' \
            -var 'filesystem=${{ matrix.filesystem }}' \
            .

      - name: Verify Box File
        run: |
          ls -lh packer/output-vagrant/ubuntu-24.04-${{ matrix.filesystem }}-virtualbox-amd64.box
          tar -tzf packer/output-vagrant/ubuntu-24.04-${{ matrix.filesystem }}-virtualbox-amd64.box | head -10

      - name: Upload Box Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-24.04-${{ matrix.filesystem }}-virtualbox-amd64
          path: packer/output-vagrant/ubuntu-24.04-${{ matrix.filesystem }}-virtualbox-amd64.box
          retention-days: 7
          compression-level: 0

      - name: Cleanup
        if: always()
        run: |
          rm -rf packer/output-*
          VBoxManage list vms | grep -oP '(?<=\")[^\"]+(?=\")' | xargs -I {} VBoxManage unregistervm "{}" --delete 2>/dev/null || true

  publish:
    name: Publish ${{ matrix.filesystem }} to Vagrant Cloud
    needs: build-virtualbox
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    strategy:
      fail-fast: false
      matrix:
        filesystem:
          - ext4
          - xfs
        exclude:
          - filesystem: ${{ github.event_name == 'workflow_dispatch' && inputs.filesystem == 'xfs' && 'ext4' || 'none' }}
          - filesystem: ${{ github.event_name == 'workflow_dispatch' && inputs.filesystem == 'ext4' && 'xfs' || 'none' }}

    environment: production

    steps:
      - name: Download Box Artifact
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-24.04-${{ matrix.filesystem }}-virtualbox-amd64
          path: ./boxes

      - name: Get Version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "version=$(date +%Y.%m.%d)" >> $GITHUB_OUTPUT
          fi

      - name: Setup Vagrant
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y vagrant

      - name: Get FS Upper
        id: fs
        run: echo "upper=$(echo '${{ matrix.filesystem }}' | tr '[:lower:]' '[:upper:]')" >> $GITHUB_OUTPUT

      - name: Publish to Vagrant Cloud
        env:
          VAGRANT_CLOUD_TOKEN: ${{ secrets.VAGRANT_CLOUD_TOKEN }}
        run: |
          vagrant cloud publish dasomel/ubuntu-24.04-${{ matrix.filesystem }} \
            ${{ steps.version.outputs.version }} \
            virtualbox \
            boxes/ubuntu-24.04-${{ matrix.filesystem }}-virtualbox-amd64.box \
            --architecture amd64 \
            --force \
            --version-description "Kubernetes-ready Ubuntu 24.04 LTS (${{ steps.fs.outputs.upper }} filesystem) v${{ steps.version.outputs.version }}

          ## Filesystem: ${{ steps.fs.outputs.upper }}
          - ext4: Mature, stable, supports online shrink
          - xfs: Better for large files, parallel I/O, K8s ephemeral storage quota

          ## Features
          - Ubuntu 24.04 LTS with OS optimizations for Kubernetes
          - Multi-architecture support (AMD64, ARM64)
          - Multi-provider support (VirtualBox, VMware)
          - 1TB disk with auto-extension at boot (thin provisioning)
          - Filesystem selection: ext4 or xfs

          ## Documentation
          https://github.com/dasomel/kube-ready-box" \
            --release \
            --short-description "K8s-ready Ubuntu 24.04 (${{ steps.fs.outputs.upper }}) Vagrant Box"
