name: Build ARM64 Vagrant Boxes

on:
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: 'Ubuntu version to build'
        required: false
        type: choice
        options:
          - '24.04'
          - '26.04'
        default: '24.04'
      provider:
        description: 'Provider to build'
        required: true
        type: choice
        options:
          - vmware
          - virtualbox
          - both
        default: vmware
      filesystem:
        description: 'Filesystem type'
        required: true
        type: choice
        options:
          - ext4
          - xfs
          - both
        default: both

permissions:
  contents: read

env:
  PACKER_VERSION: '1.15.4'
  UBUNTU_VERSION: ${{ github.event.inputs.ubuntu_version || '24.04' }}

jobs:
  build-vmware-arm64:
    name: Build VMware ARM64 (${{ matrix.filesystem }})
    runs-on: [self-hosted, macOS, ARM64]
    if: inputs.provider == 'vmware' || inputs.provider == 'both'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        filesystem:
          - ext4
          - xfs
        exclude:
          - filesystem: ${{ inputs.filesystem == 'xfs' && 'ext4' || 'none' }}
          - filesystem: ${{ inputs.filesystem == 'ext4' && 'xfs' || 'none' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Verify VMware Fusion
        run: |
          /Applications/VMware\ Fusion.app/Contents/Library/vmrun -T fusion list || echo "VMware Fusion check"

      - name: Packer Init
        working-directory: packer
        run: packer init .
        # 비인증 GitHub API 는 러너 IP 단위로 한도가 걸려 plugin 조회가 403 으로 실패한다.
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Packer Validate
        working-directory: packer
        run: |
          packer validate -only='vmware-iso.ubuntu-vmware-arm64' \
            -var 'filesystem=${{ matrix.filesystem }}' \
            -var 'ubuntu_version=${{ env.UBUNTU_VERSION }}' .

      - name: Packer Build
        working-directory: packer
        run: |
          packer build -only='vmware-iso.ubuntu-vmware-arm64' \
            -var 'headless=true' \
            -var 'filesystem=${{ matrix.filesystem }}' \
            -var 'ubuntu_version=${{ env.UBUNTU_VERSION }}' \
            .

      - name: Verify Box File
        run: |
          ls -lh packer/output-vagrant/ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }}-vmware-arm64.box

      - name: Upload Box Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }}-vmware-arm64
          path: packer/output-vagrant/ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }}-vmware-arm64.box
          retention-days: 7
          compression-level: 0

      - name: Cleanup
        if: always()
        run: |
          rm -rf packer/output-*

  build-virtualbox-arm64:
    name: Build VirtualBox ARM64 (${{ matrix.filesystem }})
    runs-on: [self-hosted, macOS, ARM64]
    if: inputs.provider == 'virtualbox' || inputs.provider == 'both'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        filesystem:
          - ext4
          - xfs
        exclude:
          - filesystem: ${{ inputs.filesystem == 'xfs' && 'ext4' || 'none' }}
          - filesystem: ${{ inputs.filesystem == 'ext4' && 'xfs' || 'none' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Verify VirtualBox
        run: |
          VBoxManage --version

      - name: Packer Init
        working-directory: packer
        run: packer init .
        # 비인증 GitHub API 는 러너 IP 단위로 한도가 걸려 plugin 조회가 403 으로 실패한다.
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Packer Validate
        working-directory: packer
        run: |
          packer validate -only='virtualbox-iso.ubuntu-vbox-arm64' \
            -var 'filesystem=${{ matrix.filesystem }}' \
            -var 'ubuntu_version=${{ env.UBUNTU_VERSION }}' .

      - name: Packer Build
        working-directory: packer
        # VirtualBox on ARM64 (macOS Silicon) cannot export to OVF, so a custom shell-local
        # post-processor builds the .box and unregisters the VM. packer's built-in cleanup
        # then exits non-zero ("Could not find a registered machine") even though a valid
        # .box was produced. Tolerate that here; the "Verify Box File" step is the real gate.
        run: |
          packer build -only='virtualbox-iso.ubuntu-vbox-arm64' \
            -var 'headless=true' \
            -var 'filesystem=${{ matrix.filesystem }}' \
            -var 'ubuntu_version=${{ env.UBUNTU_VERSION }}' \
            . || echo "::warning::packer exited non-zero (known VBox ARM64 cleanup quirk); verifying box on disk next"

      - name: Verify Box File
        run: |
          BOX="packer/output-vagrant/ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }}-virtualbox-arm64.box"
          if [ ! -f "$BOX" ]; then
            echo "::error::Box file not found: $BOX (build truly failed)"; exit 1
          fi
          ls -lh "$BOX"
          # Integrity: must be a valid gzip tar (catches truncation/partial export)
          tar -tzf "$BOX" >/dev/null || { echo "::error::Box archive is corrupt: $BOX"; exit 1; }
          echo "Box verified OK: $BOX"

      - name: Upload Box Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }}-virtualbox-arm64
          path: packer/output-vagrant/ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }}-virtualbox-arm64.box
          retention-days: 7
          compression-level: 0

      - name: Cleanup
        if: always()
        run: |
          rm -rf packer/output-*
          VBoxManage list vms | grep -oE '"[^"]+"' | tr -d '"' | xargs -I {} VBoxManage unregistervm "{}" --delete 2>/dev/null || true
