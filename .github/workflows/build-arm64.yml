name: Build ARM64 Vagrant Boxes

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Box version (e.g., 0.2.1)'
        required: false
        type: string
        default: ''
      ubuntu_version:
        description: 'Ubuntu version to build'
        required: false
        type: choice
        options:
          - '24.04'
          - '26.04'
        default: '24.04'
      provider:
        description: 'Provider to build'
        required: true
        type: choice
        options:
          - vmware
          - virtualbox
          - both
        default: vmware
      filesystem:
        description: 'Filesystem type'
        required: true
        type: choice
        options:
          - ext4
          - xfs
          - both
        default: both
      publish:
        description: 'Publish to Vagrant Cloud'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  PACKER_VERSION: '1.10.0'
  UBUNTU_VERSION: ${{ github.event.inputs.ubuntu_version || '24.04' }}

jobs:
  build-vmware-arm64:
    name: Build VMware ARM64 (${{ matrix.filesystem }})
    runs-on: [self-hosted, macOS, ARM64]
    if: inputs.provider == 'vmware' || inputs.provider == 'both'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        filesystem:
          - ext4
          - xfs
        exclude:
          - filesystem: ${{ inputs.filesystem == 'xfs' && 'ext4' || 'none' }}
          - filesystem: ${{ inputs.filesystem == 'ext4' && 'xfs' || 'none' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Verify VMware Fusion
        run: |
          /Applications/VMware\ Fusion.app/Contents/Library/vmrun -T fusion list || echo "VMware Fusion check"

      - name: Packer Init
        working-directory: packer
        run: packer init .

      - name: Packer Validate
        working-directory: packer
        run: |
          packer validate -only='vmware-iso.ubuntu-vmware-arm64' \
            -var 'filesystem=${{ matrix.filesystem }}' \
            -var 'ubuntu_version=${{ env.UBUNTU_VERSION }}' .

      - name: Packer Build
        working-directory: packer
        run: |
          packer build -only='vmware-iso.ubuntu-vmware-arm64' \
            -var 'headless=true' \
            -var 'filesystem=${{ matrix.filesystem }}' \
            -var 'ubuntu_version=${{ env.UBUNTU_VERSION }}' \
            .

      - name: Verify Box File
        run: |
          ls -lh packer/output-vagrant/ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }}-vmware-arm64.box

      - name: Upload Box Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }}-vmware-arm64
          path: packer/output-vagrant/ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }}-vmware-arm64.box
          retention-days: 7
          compression-level: 0

      - name: Cleanup
        if: always()
        run: |
          rm -rf packer/output-*

  build-virtualbox-arm64:
    name: Build VirtualBox ARM64 (${{ matrix.filesystem }})
    runs-on: [self-hosted, macOS, ARM64]
    if: inputs.provider == 'virtualbox' || inputs.provider == 'both'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        filesystem:
          - ext4
          - xfs
        exclude:
          - filesystem: ${{ inputs.filesystem == 'xfs' && 'ext4' || 'none' }}
          - filesystem: ${{ inputs.filesystem == 'ext4' && 'xfs' || 'none' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Verify VirtualBox
        run: |
          VBoxManage --version

      - name: Packer Init
        working-directory: packer
        run: packer init .

      - name: Packer Validate
        working-directory: packer
        run: |
          packer validate -only='virtualbox-iso.ubuntu-vbox-arm64' \
            -var 'filesystem=${{ matrix.filesystem }}' \
            -var 'ubuntu_version=${{ env.UBUNTU_VERSION }}' .

      - name: Packer Build
        working-directory: packer
        # VirtualBox on ARM64 (macOS Silicon) cannot export to OVF, so a custom shell-local
        # post-processor builds the .box and unregisters the VM. packer's built-in cleanup
        # then exits non-zero ("Could not find a registered machine") even though a valid
        # .box was produced. Tolerate that here; the "Verify Box File" step is the real gate.
        run: |
          packer build -only='virtualbox-iso.ubuntu-vbox-arm64' \
            -var 'headless=true' \
            -var 'filesystem=${{ matrix.filesystem }}' \
            -var 'ubuntu_version=${{ env.UBUNTU_VERSION }}' \
            . || echo "::warning::packer exited non-zero (known VBox ARM64 cleanup quirk); verifying box on disk next"

      - name: Verify Box File
        run: |
          BOX="packer/output-vagrant/ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }}-virtualbox-arm64.box"
          if [ ! -f "$BOX" ]; then
            echo "::error::Box file not found: $BOX (build truly failed)"; exit 1
          fi
          ls -lh "$BOX"
          # Integrity: must be a valid gzip tar (catches truncation/partial export)
          tar -tzf "$BOX" >/dev/null || { echo "::error::Box archive is corrupt: $BOX"; exit 1; }
          echo "Box verified OK: $BOX"

      - name: Upload Box Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }}-virtualbox-arm64
          path: packer/output-vagrant/ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }}-virtualbox-arm64.box
          retention-days: 7
          compression-level: 0

      - name: Cleanup
        if: always()
        run: |
          rm -rf packer/output-*
          VBoxManage list vms | grep -oE '"[^"]+"' | tr -d '"' | xargs -I {} VBoxManage unregistervm "{}" --delete 2>/dev/null || true

  publish:
    name: Publish ${{ matrix.filesystem }} to Vagrant Cloud
    needs: [build-vmware-arm64, build-virtualbox-arm64]
    runs-on: ubuntu-latest
    if: |
      always() &&
      inputs.publish == true &&
      (needs.build-vmware-arm64.result == 'success' || needs.build-virtualbox-arm64.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        filesystem:
          - ext4
          - xfs
        exclude:
          - filesystem: ${{ inputs.filesystem == 'xfs' && 'ext4' || 'none' }}
          - filesystem: ${{ inputs.filesystem == 'ext4' && 'xfs' || 'none' }}

    environment: production

    steps:
      - name: Download VMware Box
        if: needs.build-vmware-arm64.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }}-vmware-arm64
          path: ./boxes
        continue-on-error: true

      - name: Download VirtualBox Box
        if: needs.build-virtualbox-arm64.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }}-virtualbox-arm64
          path: ./boxes
        continue-on-error: true

      - name: Get Version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=$(date +%Y.%m.%d)" >> $GITHUB_OUTPUT
          fi

      - name: Get FS Upper
        id: fs
        run: echo "upper=$(echo '${{ matrix.filesystem }}' | tr '[:lower:]' '[:upper:]')" >> $GITHUB_OUTPUT

      - name: Setup Vagrant
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y vagrant

      - name: Publish VMware Box
        if: needs.build-vmware-arm64.result == 'success'
        env:
          HCP_CLIENT_ID: ${{ secrets.HCP_CLIENT_ID }}
          HCP_CLIENT_SECRET: ${{ secrets.HCP_CLIENT_SECRET }}
        run: |
          BOX_FILE="boxes/ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }}-vmware-arm64.box"
          [ ! -f "$BOX_FILE" ] && echo "Box file not found, skipping" && exit 0

          vagrant cloud publish dasomel/ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }} \
            ${{ steps.version.outputs.version }} \
            vmware_desktop \
            "$BOX_FILE" \
            --architecture arm64 \
            --force \
            --version-description "Kubernetes-ready Ubuntu ${{ env.UBUNTU_VERSION }} LTS (${{ steps.fs.outputs.upper }} filesystem) v${{ steps.version.outputs.version }}

          ## Filesystem: ${{ steps.fs.outputs.upper }}
          - ext4: Mature, stable, supports online shrink
          - xfs: Better for large files, parallel I/O, K8s ephemeral storage quota

          ## Features
          - Ubuntu ${{ env.UBUNTU_VERSION }} LTS with OS optimizations for Kubernetes
          - Multi-architecture support (AMD64, ARM64)
          - Multi-provider support (VirtualBox, VMware)
          - 1TB disk with auto-extension at boot (thin provisioning)
          - Filesystem selection: ext4 or xfs

          ## Documentation
          https://github.com/dasomel/kube-ready-box" \
            --release \
            --short-description "K8s-ready Ubuntu ${{ env.UBUNTU_VERSION }} (${{ steps.fs.outputs.upper }}) Vagrant Box"

      - name: Add VirtualBox Provider
        if: needs.build-virtualbox-arm64.result == 'success'
        env:
          HCP_CLIENT_ID: ${{ secrets.HCP_CLIENT_ID }}
          HCP_CLIENT_SECRET: ${{ secrets.HCP_CLIENT_SECRET }}
        run: |
          BOX_FILE="boxes/ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }}-virtualbox-arm64.box"
          [ ! -f "$BOX_FILE" ] && echo "Box file not found, skipping" && exit 0

          vagrant cloud provider create dasomel/ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }} \
            ${{ steps.version.outputs.version }} virtualbox \
            --architecture arm64 2>/dev/null || echo "Provider already exists"

          vagrant cloud provider upload dasomel/ubuntu-${{ env.UBUNTU_VERSION }}-${{ matrix.filesystem }} \
            ${{ steps.version.outputs.version }} virtualbox \
            arm64 "$BOX_FILE"
