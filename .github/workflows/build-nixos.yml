name: Build NixOS Vagrant Box

on:
  workflow_dispatch:
    inputs:
      format:
        description: 'Box format'
        required: true
        type: choice
        options:
          - vagrant-virtualbox
          - vagrant-libvirt
          - raw-efi
        default: vagrant-virtualbox

permissions:
  contents: read

jobs:
  build-nixos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Validate NixOS Configuration
        run: |
          ./nixos/build.sh validate || true

      - name: Build NixOS Vagrant Box
        run: |
          nix run github:nix-community/nixos-generators -- \
            --format ${{ github.event.inputs.format }} \
            --configuration ./nixos/configuration.nix \
            -o ./nixos/output-vagrant/nixos-kube-ready-${{ github.event.inputs.format }}.box

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixos-kube-ready-${{ github.event.inputs.format }}
          path: ./nixos/output-vagrant/*.box
