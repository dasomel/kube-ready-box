name: NixOS AppArmor VM Test

on:
  pull_request:
    paths:
      - 'nixos/**'
      - 'security/workload-security-check.sh'
      - '.github/workflows/nixos-apparmor-vm-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apparmor-vm-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = kvm nixos-test big-parallel benchmark

      - name: Run AppArmor VM Test
        run: |
          nix build -L ./nixos#checks.x86_64-linux.apparmor-vm
