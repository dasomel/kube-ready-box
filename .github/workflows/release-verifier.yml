name: Release kube-ready-verifier

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Confirm Rust toolchain
        run: rustc --version && cargo --version
      - name: Test verifier offline
        working-directory: rust/kube-ready-verifier
        run: cargo test --locked --offline
      - name: Build release binary offline
        working-directory: rust/kube-ready-verifier
        run: cargo build --release --locked --offline
      - name: Stage release asset
        working-directory: rust/kube-ready-verifier
        run: |
          mkdir -p dist
          cp target/release/kube-ready-verifier "dist/kube-ready-verifier-${{ matrix.target }}"
          sha256sum "dist/kube-ready-verifier-${{ matrix.target }}" > "dist/SHA256SUMS-${{ matrix.target }}"
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kube-ready-verifier-${{ matrix.target }}
          path: rust/kube-ready-verifier/dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: kube-ready-verifier-*
          path: release-inputs
          merge-multiple: true
      - name: Assemble release assets and checksums
        run: |
          mkdir release-assets
          find release-inputs -maxdepth 1 -type f -name 'kube-ready-verifier-*' -exec cp {} release-assets/ \;
          test "$(find release-assets -maxdepth 1 -type f -name 'kube-ready-verifier-*' | wc -l)" -eq 2
          (
            cd release-assets
            sha256sum kube-ready-verifier-* > SHA256SUMS
          )
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kube-ready-verifier-release-${{ github.ref_name }}
          path: release-assets/
          if-no-files-found: error
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          gh release upload "$TAG" release-assets/kube-ready-verifier-* release-assets/SHA256SUMS --clobber
