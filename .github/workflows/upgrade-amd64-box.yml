name: Upgrade AMD64 Box to 0.1.3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade-virtualbox:
    name: Upgrade VirtualBox AMD64 to 0.1.3
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install VirtualBox
        run: |
          wget -q https://www.virtualbox.org/download/oracle_vbox_2016.asc -O- | sudo apt-key add -
          echo "deb [arch=amd64] https://download.virtualbox.org/virtualbox/debian $(lsb_release -cs) contrib" | sudo tee /etc/apt/sources.list.d/virtualbox.list
          sudo apt-get update
          sudo apt-get install -y virtualbox-7.0
          VBoxManage --version

      - name: Setup Vagrant
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y vagrant

      - name: Download 0.1.0 Box
        run: |
          mkdir -p work
          cd work
          cat > Vagrantfile << 'EOF'
          Vagrant.configure("2") do |config|
            config.vm.box = "dasomel/ubuntu-24.04"
            config.vm.box_version = "0.1.0"
            config.vm.provider "virtualbox" do |vb|
              vb.memory = "2048"
              vb.cpus = 2
            end
          end
          EOF
          vagrant box add dasomel/ubuntu-24.04 --box-version 0.1.0 --provider virtualbox

      - name: Create Upgrade Script
        run: |
          cat > work/apply-0.1.3-changes.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          export DEBIAN_FRONTEND=noninteractive

          echo "=== Applying 0.1.3 changes ==="

          # Switch to Korean mirror (from 0.1.1)
          echo "Switching to Korean mirror..."
          ARCH=$(dpkg --print-architecture)
          if [ "$ARCH" = "amd64" ]; then
            sudo sed -i 's|archive.ubuntu.com|kr.archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
            sudo sed -i 's|security.ubuntu.com|kr.archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
            echo "  -> AMD64: Using kr.archive.ubuntu.com"
          fi

          # Set Korean timezone (from 0.1.1)
          echo "Setting timezone to Asia/Seoul (KST)..."
          sudo timedatectl set-timezone Asia/Seoul
          echo "  -> Timezone: $(timedatectl show --property=Timezone --value)"

          # Configure Korean NTP servers (from 0.1.1)
          echo "Configuring Korean NTP servers..."
          sudo mkdir -p /etc/systemd/timesyncd.conf.d
          sudo tee /etc/systemd/timesyncd.conf.d/kr-ntp.conf > /dev/null <<EOF
          [Time]
          NTP=time.bora.net time.kriss.re.kr ntp.kornet.net
          FallbackNTP=ntp.ubuntu.com
          EOF
          sudo systemctl restart systemd-timesyncd
          echo "  -> NTP servers configured"

          # Install growpart for disk auto-extension (0.1.3 feature)
          echo "Installing cloud-guest-utils for disk auto-extension..."
          sudo apt-get update
          sudo apt-get install -y cloud-guest-utils

          # Update extend-lvm.sh with full disk extension support (0.1.3 feature)
          echo "Installing disk auto-extension script..."
          sudo tee /usr/local/bin/extend-lvm.sh > /dev/null << 'LVMSCRIPT'
          #!/bin/bash
          # Auto-extend disk: partition → PV → LV → filesystem
          # Supports both SATA (sda) and NVMe (nvme0n1) disks
          set -e

          LOG_TAG="extend-lvm"

          log() {
            logger -t "$LOG_TAG" "$1"
            echo "$1"
          }

          # Wait for devices to be ready
          sleep 3

          # Find the disk device and LVM partition
          DISK=""
          PART_NUM=""
          PART_DEV=""

          # Check for NVMe disk first
          if [ -b /dev/nvme0n1 ]; then
            DISK="/dev/nvme0n1"
            for p in 3 2 1; do
              if [ -b "/dev/nvme0n1p${p}" ]; then
                if pvs "/dev/nvme0n1p${p}" &>/dev/null; then
                  PART_NUM=$p
                  PART_DEV="/dev/nvme0n1p${p}"
                  break
                fi
              fi
            done
          # Check for SATA/SCSI disk
          elif [ -b /dev/sda ]; then
            DISK="/dev/sda"
            for p in 3 2 1; do
              if [ -b "/dev/sda${p}" ]; then
                if pvs "/dev/sda${p}" &>/dev/null; then
                  PART_NUM=$p
                  PART_DEV="/dev/sda${p}"
                  break
                fi
              fi
            done
          fi

          if [ -z "$DISK" ] || [ -z "$PART_DEV" ]; then
            log "No suitable disk/partition found for extension"
            exit 0
          fi

          log "Disk: $DISK, LVM partition: $PART_DEV (partition $PART_NUM)"

          # Step 1: Extend partition using growpart
          log "Step 1: Extending partition $PART_NUM on $DISK..."
          if growpart "$DISK" "$PART_NUM" 2>&1; then
            log "  -> Partition extended successfully"
          else
            log "  -> Partition already at maximum size or growpart failed"
          fi

          # Step 2: Resize Physical Volume
          log "Step 2: Resizing PV $PART_DEV..."
          if pvresize "$PART_DEV" 2>&1; then
            log "  -> PV resized successfully"
          else
            log "  -> PV resize failed or not needed"
          fi

          # Step 3: Extend Logical Volume
          VG_FREE=$(vgs --noheadings -o vg_free --units g ubuntu-vg 2>/dev/null | tr -d ' g' | cut -d. -f1)
          if [ -n "$VG_FREE" ] && [ "$VG_FREE" -gt 0 ]; then
            log "Step 3: Extending LV by ${VG_FREE}GB..."
            if lvextend -l +100%FREE /dev/ubuntu-vg/ubuntu-lv 2>&1; then
              log "  -> LV extended successfully"
            else
              log "  -> LV extend failed"
            fi
          else
            log "Step 3: No free space in VG, skipping LV extension"
          fi

          # Step 4: Resize filesystem
          log "Step 4: Resizing filesystem..."
          if resize2fs /dev/ubuntu-vg/ubuntu-lv 2>&1; then
            log "  -> Filesystem resized successfully"
          else
            log "  -> Filesystem resize failed or not needed"
          fi

          # Show final disk usage
          log "Disk extension complete. Current usage:"
          df -h / | logger -t "$LOG_TAG"
          LVMSCRIPT
          sudo chmod +x /usr/local/bin/extend-lvm.sh

          # Cleanup
          echo "Cleaning up..."
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /tmp/*
          sudo rm -f /var/log/*.log
          history -c

          echo "=== 0.1.3 changes applied successfully ==="
          SCRIPT
          chmod +x work/apply-0.1.3-changes.sh

      - name: Start VM and Apply Changes
        run: |
          cd work
          vagrant up
          vagrant ssh -c "cat /tmp/apply-changes.sh" < apply-0.1.3-changes.sh || true
          cat apply-0.1.3-changes.sh | vagrant ssh -- 'cat > /tmp/apply-changes.sh && chmod +x /tmp/apply-changes.sh && sudo /tmp/apply-changes.sh'

      - name: Verify Changes
        run: |
          cd work
          vagrant ssh -- 'echo "=== Timezone ===" && timedatectl show --property=Timezone --value && echo "" && echo "=== APT Mirror ===" && grep -E "archive.ubuntu.com" /etc/apt/sources.list.d/ubuntu.sources | head -2 && echo "" && echo "=== NTP ===" && cat /etc/systemd/timesyncd.conf.d/kr-ntp.conf && echo "" && echo "=== Disk Extension Script ===" && ls -la /usr/local/bin/extend-lvm.sh && echo "" && echo "=== growpart installed ===" && which growpart'

      - name: Package Box
        run: |
          cd work
          vagrant halt
          vagrant package --output ubuntu-24.04-virtualbox-amd64-0.1.3.box
          ls -lh ubuntu-24.04-virtualbox-amd64-0.1.3.box

      - name: Upload to Vagrant Cloud
        env:
          VAGRANT_CLOUD_TOKEN: ${{ secrets.VAGRANT_CLOUD_TOKEN }}
        run: |
          cd work
          # Create provider: vagrant cloud provider create org/box provider version --architecture arch
          vagrant cloud provider create dasomel/ubuntu-24.04 virtualbox 0.1.3 \
            --architecture amd64 2>/dev/null || echo "Provider already exists"

          # Upload box: vagrant cloud provider upload org/box provider version architecture file
          vagrant cloud provider upload dasomel/ubuntu-24.04 virtualbox 0.1.3 \
            amd64 ubuntu-24.04-virtualbox-amd64-0.1.3.box

      - name: Cleanup
        if: always()
        run: |
          cd work
          vagrant destroy -f || true
          vagrant box remove dasomel/ubuntu-24.04 --all -f || true
          rm -rf work
