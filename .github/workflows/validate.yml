name: Validate Packer Configuration

on:
  pull_request:
    paths:
      - 'packer/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'packer/**'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Packer Files (${{ matrix.filesystem }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        filesystem: [ext4, xfs]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: '1.15.4'

      - name: Packer Format Check
        working-directory: packer
        run: |
          packer fmt -check -diff .

      - name: Packer Init
        working-directory: packer
        run: packer init .

      - name: Validate VirtualBox AMD64
        working-directory: packer
        run: |
          packer validate -only='virtualbox-iso.ubuntu-vbox-amd64' \
            -var 'filesystem=${{ matrix.filesystem }}' .

      - name: Validate VirtualBox ARM64
        working-directory: packer
        run: |
          packer validate -only='virtualbox-iso.ubuntu-vbox-arm64' \
            -var 'filesystem=${{ matrix.filesystem }}' .

      - name: Validate VMware AMD64
        working-directory: packer
        run: |
          packer validate -only='vmware-iso.ubuntu-vmware-amd64' \
            -var 'filesystem=${{ matrix.filesystem }}' .

      - name: Validate VMware ARM64
        working-directory: packer
        run: |
          packer validate -only='vmware-iso.ubuntu-vmware-arm64' \
            -var 'filesystem=${{ matrix.filesystem }}' .

  shellcheck:
    name: Shellcheck Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Shellcheck
        run: |
          find packer/scripts -name "*.sh" -exec shellcheck --severity=warning {} +
