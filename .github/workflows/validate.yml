name: Validate Kube-ready Contracts

on:
  pull_request:
    paths:
      - 'packer/**'
      - 'rust/**'
      - 'nixos/**'
      - 'rocky/**'
      - 'security/**'
      - 'network/**'
      - 'storage/**'
      - 'time/**'
      - 'observability/**'
      - 'tools/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'packer/**'
      - 'rust/**'
      - 'nixos/**'
      - 'rocky/**'
      - 'security/**'
      - 'network/**'
      - 'storage/**'
      - 'time/**'
      - 'observability/**'
      - 'tools/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  packer:
    name: Packer validate (${{ matrix.filesystem }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix: { filesystem: [ext4, xfs] }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-packer@v3
        with: { version: '1.15.4' }
      - name: Format
        working-directory: packer
        run: packer fmt -check -diff .
      - name: Init
        working-directory: packer
        run: packer init .
      - name: Validate all providers
        working-directory: packer
        run: |
          packer validate -only='virtualbox-iso.ubuntu-vbox-amd64' -var 'filesystem=${{ matrix.filesystem }}' .
          packer validate -only='virtualbox-iso.ubuntu-vbox-arm64' -var 'filesystem=${{ matrix.filesystem }}' .
          packer validate -only='vmware-iso.ubuntu-vmware-amd64' -var 'filesystem=${{ matrix.filesystem }}' .
          packer validate -only='vmware-iso.ubuntu-vmware-arm64' -var 'filesystem=${{ matrix.filesystem }}' .

  shellcheck:
    name: Shell syntax/static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: |
          find packer/scripts nixos rocky security network storage time observability tools rust -type f -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=warning

  rust:
    name: Rust verifier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-unknown-linux-gnu }
      - name: Native offline build/check
        working-directory: rust/kube-ready-verifier
        run: |
          cargo check --locked --offline
          cargo build --release --locked --offline
          bash tests/cli_contract.sh
      - name: ARM64 offline compile check
        working-directory: rust/kube-ready-verifier
        run: cargo check --locked --offline --target aarch64-unknown-linux-gnu

  contract-syntax:
    name: Contract syntax and JSON smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          bash -n tools/*.sh network/*.sh storage/*.sh time/*.sh security/*.sh observability/*.sh rocky/*.sh nixos/*.sh
          python3 -m json.tool /dev/null >/dev/null 2>&1 || true
      - name: Verify tool help
        working-directory: rust/kube-ready-verifier
        run: cargo run --locked --offline -- --help
