name: Validate Packer Configuration

on:
  pull_request:
    paths:
      - 'packer/**'
      - 'rust/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'packer/**'
      - 'rust/**'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Packer Files (${{ matrix.filesystem }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        filesystem: [ext4, xfs]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: '1.15.4'

      - name: Packer Format Check
        working-directory: packer
        run: packer fmt -check -diff .

      - name: Packer Init
        working-directory: packer
        run: packer init .

      - name: Validate VirtualBox AMD64
        working-directory: packer
        run: packer validate -only='virtualbox-iso.ubuntu-vbox-amd64' -var 'filesystem=${{ matrix.filesystem }}' .

      - name: Validate VirtualBox ARM64
        working-directory: packer
        run: packer validate -only='virtualbox-iso.ubuntu-vbox-arm64' -var 'filesystem=${{ matrix.filesystem }}' .

      - name: Validate VMware AMD64
        working-directory: packer
        run: packer validate -only='vmware-iso.ubuntu-vmware-amd64' -var 'filesystem=${{ matrix.filesystem }}' .

      - name: Validate VMware ARM64
        working-directory: packer
        run: packer validate -only='vmware-iso.ubuntu-vmware-arm64' -var 'filesystem=${{ matrix.filesystem }}' .

  shellcheck:
    name: Shellcheck Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Shellcheck
        run: find packer/scripts -name "*.sh" -exec shellcheck --severity=warning {} +

  rust-verifier:
    name: Rust verifier (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build offline
        working-directory: rust/kube-ready-verifier
        run: cargo build --release --offline --target ${{ matrix.target }}
      - name: Check
        working-directory: rust/kube-ready-verifier
        run: cargo check --locked --offline
      - name: Contract smoke test
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: rust/kube-ready-verifier
        run: |
          cargo build --offline
          bash tests/cli_contract.sh
