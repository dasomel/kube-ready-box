text
lang en_US.UTF-8
keyboard --vckeymap=us
timezone Asia/Seoul --utc
rootpw --lock
# vagrant/vagrant, Vagrant 관례적 insecure 패스워드 (SHA-512 crypt, 고정값 -
# 재현 가능한 빌드를 위해 매 빌드마다 openssl passwd로 새로 생성하지 않는다).
# Packer의 ssh_password=var.ssh_password("vagrant")가 이 계정으로 초기 SSH
# 접속을 하므로 패스워드가 없으면(기본은 잠김) SSH 인증 자체가 실패한다.
user --name=vagrant --groups=wheel --password=$6$tnA13.YmnpelHzxX$QMETuR8OqhRqh6cL2h.ITpmhYR.U/8Hi20Ie.dNEpv4S9.iTmS1Ryy9DkbWO0Ig5HTE6kZHNflie0V36B1kNb. --iscrypted
selinux --enforcing
firewall --enabled --service=ssh
network --bootproto=dhcp --activate --hostname=vagrant-rocky
services --enabled=sshd,chronyd,NetworkManager
bootloader --timeout=5
zerombr
clearpart --all --initlabel
part /boot/efi --fstype=efi --size=200
part /boot --fstype=ext4 --size=1024
part pv.01 --grow --size=1
volgroup rocky-vg pv.01
logvol / --vgname=rocky-vg --name=rocky-lv --fstype=ext4 --grow --size=8192
reboot --eject

%packages
# open-vm-tools는 minimal ISO 로컬 저장소에 없어 anaconda가 대화형으로
# "missing packages, continue?"를 물어 설치가 멈춘다(실제 빌드에서 확인됨) -
# 네트워크가 붙는 01-base-rocky.sh 단계에서 dnf로 설치한다.
@core
openssh-server
chrony
sudo
-plymouth
%end

%post --log=/root/ks-post.log
echo 'vagrant ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/vagrant
chmod 440 /etc/sudoers.d/vagrant
sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
sed -i 's/^#*PubkeyAuthentication.*/PubkeyAuthentication yes/' /etc/ssh/sshd_config
systemctl enable sshd
%end
